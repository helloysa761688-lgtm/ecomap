<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — EcoMap</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <div class="auth-logo">
      <div class="logo-pin"><span>♻</span></div>
      <div class="eco-word">EcoMap SA</div>
    </div>

    <div style="text-align:center;margin-bottom:22px">
      <h2 style="margin:0 0 8px">Olá! 🌱</h2>
      <p style="margin:0;font-size:14px">Digite seu nome e sobrenome.</p>
    </div>

    <form id="loginForm">
      <input class="input" id="userName" type="text" placeholder="  Seu nome" autocomplete="name" required>
      <button class="btn btn-green" type="submit">Entrar</button>
    </form>
  </section>
</main>
<script src="../js/script.js"></script>
</body>
</html>
